[package]
name = "cw20-base-dogether"
version = "0.9.1"
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>, 0xantman"]
edition = "2018"
description = "Basic implementation of a CosmWasm-20 compliant token adapted for no-loss lottery dogether (LoTerra)"
license = "Apache-2.0"
repository = "https://github.com/LoTerra/cw20-contract-dogether"
homepage = "https://loterra.io"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
backtraces = ["cosmwasm-std/backtraces"]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cw0 = { version = "0.9.1" }
cw2 = { version = "0.9.1" }
cw20 = { version = "0.9.1" }
cw-storage-plus = { version = "0.9.1", features = ["iterator"] }
cosmwasm-std = { version = "0.16.0", features = ["iterator"] }
schemars = "0.8.1"
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.23" }

[dev-dependencies]
cosmwasm-schema = { version = "0.16.0" }
