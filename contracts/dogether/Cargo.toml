[package]
name = "dogether"
version = "0.1.0"
authors = ["0xantman <antho74830@gmail.com>"]
edition = "2018"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[features]
# for more explicit tests, cargo test --features=backtraces
backtraces = ["cosmwasm-std/backtraces"]
library = []

[dependencies]
cosmwasm-std = { version = "0.14.0" }
cosmwasm-storage = { version = "0.14.0" }
cw-storage-plus = "0.6.0"
schemars = "0.8.1"
serde = { version = "1.0.125", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.24" }
cw20 = "0.6.2"
cw20-base-dogether = {path="../../contracts/cw20-contract-dogether", version="0.6.2"}
loterra-staking-contract-dogether = {path="../../contracts/loterra-staking-contract-dogether", version="2.0.2", features = ["library"]}
# loterra-staking-contract = "2.0.2"
terra-cosmwasm = "~2.0.0"
cosmwasm-bignumber = "~2.0.0"

[dev-dependencies]
cosmwasm-schema = { version = "0.14.0" }
